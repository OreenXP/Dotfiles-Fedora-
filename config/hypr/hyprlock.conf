# hyprlock - minimalista acorde a rofi/waybar
# paleta: bg #0b0b0b | fg #e6e6e6 | muted #9a9a9a | borde #2a2a2a | acento #ffb4b4

background {
    monitor =
    path = !!WALLPAPER!!
    color = rgba(11, 11, 11, 0.20)
    blur_passes = 3
    blur_size = 2
    noise = 0.01
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.1696
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_family = JetBrains Mono
    font_size = 42
    color = rgba(230, 230, 230, 0.95)
    position = 0, 56
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d/%m/%Y"
    font_family = JetBrains Mono
    font_size = 14
    color = rgba(154, 154, 154, 0.9)
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.12
    dots_spacing = 0.4
    dots_center = true

    outer_color = rgb(2a2a2a)
    inner_color = rgba(20, 20, 20, 0.7)
    font_color = rgb(e6e6e6)
    check_color = rgb(255b4b4)
    fail_color = rgb(2a1515)
    fail_text = <span foreground="#ffb4b4">Incorrecto</span>
    placeholder_text = Contraseña

    fade_on_empty = true
    position = 0, -56
    halign = center
    valign = center
}